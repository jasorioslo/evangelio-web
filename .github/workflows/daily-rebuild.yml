name: Daily rebuild

on:
  schedule:
    # 6:00 UTC = medianoche hora de Mexico (CST, UTC-6)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger rebuild (empty commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Daily rebuild $(date -u +%Y-%m-%d)"
          git push